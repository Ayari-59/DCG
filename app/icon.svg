<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!--
    Favicon : le signe est repris en variante compacte, sur pastille marine.
    À seize pixels les traits fins se seraient refermés les uns sur les
    autres, et le signe sans fond se serait perdu dans l'onglet.
  -->
  <mask id="degagement" maskUnits="userSpaceOnUse">
    <rect width="120" height="120" fill="#fff"/>
    <path d="M10 100 C32 92 46 78 62 60 C78 42 88 32 104 22" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round"/>
  </mask>
  <rect width="120" height="120" rx="26" fill="#0e2244"/>
  <g mask="url(#degagement)">
    <circle cx="60" cy="60" r="37" fill="none" stroke="#f07e26" stroke-width="16"/>
    <circle cx="60" cy="60" r="20" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#fbb040" stroke-width="10" stroke-linecap="round">
    <path d="M16 95 C35 87 48 76 62 59 C73 45 84 35 95 27"/>
    <path d="M91.6 40.3 L100 22.7 L80.5 23.5" stroke-linejoin="miter"/>
  </g>
</svg>
